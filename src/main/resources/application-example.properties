spring.application.name=expense-splitter

#spring.application.name=expense-splitter

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/splitter
spring.datasource.username=user_name
spring.datasource.password=Your_password

# JPA
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT (we'll use these in the next step)
app.jwt.secret=change-this-to-a-long-random-string-of-at-least-32-characters
app.jwt.expiration-ms=86400000